name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Wrap the web app with Capacitor (plus background GPS and notifications)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {"name":"sunup-trail","version":"2.0.0","private":true}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.markdave.sunuptrail","appName":"Sunup Trail","webDir":"www","android":{"useLegacyBridge":true}}
          EOF
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor-community/background-geolocation@1.2.26 @capacitor/local-notifications@6.1.3
          npx cap add android
          npx cap sync android

      - name: Add camera and vibration permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          V=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_walk</string>\n    <string name="capacitor_background_geolocation_notification_channel_name">Walk tracking</string>\n</resources>#' $V
          grep -n "permission" $M

      - name: App icon and notification icon
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os, math
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          dens = {'mdpi':1, 'hdpi':1.5, 'xhdpi':2, 'xxhdpi':3, 'xxxhdpi':4}
          def masked(img, shape):
              n = img.size[0]
              m = Image.new('L', (n, n), 0)
              d = ImageDraw.Draw(m)
              if shape == 'round':
                  d.ellipse([0, 0, n-1, n-1], fill=255)
              else:
                  d.rounded_rectangle([0, 0, n-1, n-1], radius=int(n*0.22), fill=255)
              out = Image.new('RGBA', (n, n), (0, 0, 0, 0))
              out.paste(img, (0, 0), m)
              return out
          for k, f in dens.items():
              d = f'{res}/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              a = int(108*f)
              src.resize((a, a), Image.LANCZOS).save(f'{d}/ic_launcher_background.png')
              Image.new('RGBA', (a, a), (0, 0, 0, 0)).save(f'{d}/ic_launcher_foreground.png')
              l = int(48*f)
              ic = src.resize((l, l), Image.LANCZOS)
              masked(ic, 'square').save(f'{d}/ic_launcher.png')
              masked(ic, 'round').save(f'{d}/ic_launcher_round.png')
              # white notification icon: rising sun over a hill
              n = int(24*f); S = n*8
              im = Image.new('RGBA', (S, S), (0, 0, 0, 0)); dr = ImageDraw.Draw(im)
              cx, cy, r = S/2, S*0.62, S*0.22
              dr.pieslice([cx-r, cy-r, cx+r, cy+r], 180, 360, fill='white')
              for i in range(5):
                  ang = math.pi + (i+0.5)*math.pi/5
                  x1, y1 = cx+math.cos(ang)*r*1.3, cy+math.sin(ang)*r*1.3
                  x2, y2 = cx+math.cos(ang)*r*1.85, cy+math.sin(ang)*r*1.85
                  dr.line([(x1, y1), (x2, y2)], fill='white', width=int(S*0.07))
              dr.rectangle([S*0.08, cy+S*0.05, S*0.92, cy+S*0.13], fill='white')
              dd = f'{res}/drawable-{k}'
              os.makedirs(dd, exist_ok=True)
              im.resize((n, n), Image.LANCZOS).save(f'{dd}/ic_stat_walk.png')
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '  <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(f'{res}/mipmap-anydpi-v26/{name}', 'w').write(xml)
          print('icons written')
          EOF

      - name: Use the repo's fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SunupTrail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SunupTrail-apk
          path: SunupTrail.apk

      - name: Publish a release you can download on your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sunup Trail build ${{ github.run_number }}
          files: SunupTrail.apk
