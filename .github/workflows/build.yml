name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Wrap the web app with Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {"name":"sunup-trail","version":"1.0.0","private":true}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.markdave.sunuptrail","appName":"Sunup Trail","webDir":"www"}
          EOF
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap sync android

      - name: Add GPS, camera and vibration permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          grep -n "permission" $M

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SunupTrail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SunupTrail-apk
          path: SunupTrail.apk

      - name: Publish a release you can download on your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sunup Trail build ${{ github.run_number }}
          files: SunupTrail.apk
